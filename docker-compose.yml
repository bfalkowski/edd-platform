services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edd_platform
      POSTGRES_USER: edd_platform
      POSTGRES_PASSWORD: edd_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edd_platform -d edd_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

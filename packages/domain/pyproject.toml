[project]
name = "edd-domain"
version = "0.1.0"
description = "Shared EDD Platform domain objects."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edd_domain"]

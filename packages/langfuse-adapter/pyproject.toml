[project]
name = "edd-langfuse-adapter"
version = "0.1.0"
description = "Langfuse trace reference adapter for EDD Platform."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edd_langfuse_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

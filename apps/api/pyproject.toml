[project]
name = "edd-platform-api"
version = "0.1.0"
description = "EDD Platform API."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.136.2",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edd_platform_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "edd-platform-api"
version = "0.1.0"
description = "EDD Platform API."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.136.2",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "langchain>=1.3.4",
  "anthropic>=0.40.0",
  "langchain-anthropic>=0.3.0",
  "opentelemetry-instrumentation-anthropic>=0.61.0",
  "langfuse>=4.7.1",
  "playwright>=1.56.0",
  "polars>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edd_platform_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
